<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Search Results</title>
</head>
<body>
    <h1>Search Complaints by Company</h1>

    <form method="get" action="/search">
        <input type="text" name="company" placeholder="Enter company name..." th:value="${company}" />
        <button type="submit">Search</button>
    </form>

    <p th:if="${error != null}" th:text="${error}" style="color: red;"></p>

    <div th:if="${results != null}">
        <h2 th:if="${results.size() > 0}">Results:</h2>
        <ul>
            <li th:each="complaint : ${results}">
                <strong th:text="'Complaint ID: ' + ${complaint.complaintId}"></strong> —
                <em th:text="${#strings.abbreviate(complaint.narrative, 200)}"></em>
            </li>
        </ul>
    </div>

    <p><a href="/complaint">Back to Viewer</a></p>
</body>
</html>
